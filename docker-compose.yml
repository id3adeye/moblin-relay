services:
  moblin-relay:
    build: .
    container_name: moblin-relay
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "127.0.0.1:3005:8080"
    environment:
      - PORT=8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    mem_limit: 256m
